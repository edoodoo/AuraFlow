  <text x="48" y="66" fill="#e5eefc" font-size="22" font-weight="700">Card Compacto com Hierarquia</text>

  <!-- Accordion surface -->
  <rect x="40" y="90" width="1200" height="756" rx="24" fill="url(#glassBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

