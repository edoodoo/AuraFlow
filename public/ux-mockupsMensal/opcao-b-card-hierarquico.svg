  <text x="1170" y="128" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="end">R$ 8.239,00</text>
  <line x1="56" y1="146" x2="1224" y2="146" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Card 1: Aluguel — Pago (border-left emerald) -->
