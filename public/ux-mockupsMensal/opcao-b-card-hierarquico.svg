  <!-- Card 7: Plano de Saúde — Parcial -->
  <rect x="60" y="704" width="1160" height="72" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="60" y="704" width="3" height="72" rx="1.5" fill="#f59e0b"/>
  <text x="88" y="734" fill="#e5eefc" font-size="14" font-weight="600">Plano de Saúde</text>
  <rect x="830" y="721" width="96" height="20" rx="10" fill="rgba(251,191,36,0.12)"/>
