  <text x="852" y="735" fill="#fbbf24" font-size="10.5" font-weight="500">Parcial · R$ 800</text>
  <text x="1188" y="735" fill="#38bdf8" font-size="17" font-weight="700" text-anchor="end">R$ 1.350,00</text>
  <text x="88" y="760" fill="#64748b" font-size="11">Saúde <tspan fill="#475569" font-size="9">·</tspan> Eduardo <tspan fill="#475569" font-size="9">·</tspan> Venc. 20/04 <tspan fill="#475569" font-size="9">·</tspan> <tspan fill="#94a3b8">Fixo</tspan></text>

  <!-- Add card (dashed) -->
  <rect x="60" y="786" width="1160" height="42" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="640" y="812" fill="#38bdf8" font-size="13" font-weight="500" text-anchor="middle">+ Adicionar item</text>

  <!-- Legend -->
  <rect x="48" y="844" width="1184" height="28" rx="12" fill="rgba(52,211,153,0.04)" stroke="rgba(52,211,153,0.1)" stroke-width="0.5"/>
  <text x="72" y="863" fill="#94a3b8" font-size="10.5"><tspan fill="#34d399" font-weight="600">Opção B — Recomendada:</tspan> Equilíbrio clareza/densidade (~72px/item). Borda left = status. Valor em cyan como âncora. Ações on-hover. Funciona de 3 a 15 itens.</text>
</svg>
